[package]
name = "katzen-airgapped"
version = "0.1.0"
edition = "2021"
authors = ["Gabriel Virebent <gabrix73>"]
description = "Air-gapped Sphinx packet & SURB generation client architecture for Katzenpost"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = { version = "0.14", default-features = false }
hex = "0.4"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20 = "0.9"
poly1305 = "0.8"
libc = "0.2"

[[bin]]
name = "katzen"
path = "src/main.rs"

[[bin]]
name = "katzen-cold"
path = "src/cold_main.rs"

[[bin]]
name = "katzen-hot"
path = "src/hot_main.rs"
